ility.py`](file:///f:/fitness-command-center/backend/apps/tenant_core/services_reliability.py)) backed by PostgreSQL `idempotency_records`.\n* **Header Support:** Extracted the key via `_extract_idempotency_key`, supporting `Idempotency-Key`, `X-Idempotency-Key`, `HTTP_IDEMPOTENCY_KEY`, and `idempotency_key` payload fallbacks with whitespace stripping.\n* **Three-Tier Scope Isolation:**\n  1. **Tenant Scoping:** Bound strictly to the member's active `Organization` (`organization_id`).\n  2. **Endpoint Scoping:** Differentiated by operation type (`WELLNESS_MEAL_LOG`, `WELLNESS_WATER_LOG`, `WELLNESS_SLEEP_LOG`).\n  3. **User Scoping:** Prefixed internally as `u:<user_uuid>:<client_key>`, guaranteeing that two different members utilizing the same key string (e.g., `req-001`) never collide or block each other.\n* **Retry, Conflict & In-Progress Handling:**\n  - **Identical Replay:** If an identical payload is re-submitted with the same key, `execute_idempotent_operation` short-circuits execution and returns the cached `response_snapshot` (HTTP 201 Created or 200 OK) without writing duplicate records to `meal_logs`, `meal_log_items`, `water_logs`, or `sleep_logs`.\n  - **Payload Conflict:** If the same key is reused with an altered payload (e.g. changing meal type, amount, or food item), the SHA-256 payload hash check fails, raising `IdempotencyConflictError` and returning **HTTP 409 Conflict** (`\"was previously submitted with a different payload\"`).\n  - **In-Progress Concurrency:** If a second ide\n<truncated 9027 bytes>\nlhost:8000/api/v1/mobile/wellness/water-logs/ \\\n  -H \"Authorization: Bearer <MEMBER_TOKEN>\" \\\n  -H \"Idempotency-Key: water-manual-001\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"logged_date\": \"2026-10-20\", \"amount_ml\": 250}'\n\n# Re-send on network retry:\n# -> Returns HTTP 201 with identical ID. Total water in daily summary remains 250 ml (not 500 ml).\n```\n\n#### C. Single Sleep Record Upsert & Boundary Test\n```bash\n#     items.forEach(m => {
      const card = document.createElement('div');
      card.className = `msg-card ${m.role}`;
      card.innerHTML = `
        <div class="msg-header">
          <span class="badge ${m.role}">${m.role === 'user' ? '👤 User' : '🤖 Assistant'}</span>
          <span class="step-pill">Step ${m.step}</span>
        </div>
        <div class="msg-body">${escapeHtml(m.text)}</div>
      `;
      container.appendChild(card);
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function filterMessages() {
    const q = document.getElementById('search').value.toLowerCase().trim();
    if (!q) {
      render(data);
      matchStats.textContent = `Showing all ${data.length} messages`;
      return;
    }
    const filtered = data.filter(m => m.text.toLowerCase().includes(q));
    render(filtered);
    matchStats.textContent = `Found ${filtered.length} matching messages out of ${data.length}`;
  }

  render(data);
</script>
</body>
</html>
